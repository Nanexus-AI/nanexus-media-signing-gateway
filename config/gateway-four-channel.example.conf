# Shared Gateway signing identity; credentials remain in protected local files.
[gateway]
signing.key_file=secrets/signer.key.pem
signing.certificate_file=secrets/signer-chain.pem

[channel.cam1]
camera.url=rtsp://camera1.example.invalid:554/stream
# camera.auth_file=secrets/camera1.auth
output.url=rtsp://127.0.0.1:18554/signed/camera1

[channel.cam2]
camera.url=rtsp://camera2.example.invalid:554/stream
output.url=rtsp://127.0.0.1:18555/signed/camera2

[channel.cam3]
camera.url=rtsp://camera3.example.invalid:554/stream
output.url=rtsp://127.0.0.1:18556/signed/camera3

[channel.cam4]
camera.url=rtsp://camera4.example.invalid:554/stream
output.url=rtsp://127.0.0.1:18557/signed/camera4
